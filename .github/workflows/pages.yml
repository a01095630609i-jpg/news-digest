name: 다이제스트 갱신 및 배포

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 한국 시간 08:00
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write   # 새 요약 파일을 저장소에 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 요약 만들기
        # push 로 실행될 때는 이미 올린 파일만 배포한다
        if: github.event_name != 'push'
        continue-on-error: true   # 피드를 못 읽어도 기존 페이지는 배포
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python rss_digest.py

      - name: 파일 목록 만들기
        run: python -c "import serve; serve.build_index()"

      - name: 새 요약 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest
          git diff --cached --quiet || git commit -m "다이제스트 갱신 $(date +%F)"
          git push

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r digest _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
